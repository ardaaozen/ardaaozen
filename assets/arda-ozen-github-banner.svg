<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Arda Özen — ürün sistemleri, veri yönetimi ve mobil deneyimler</title>
  <desc id="desc">Kömür siyahı ve şampanya altını tonlarında kişisel profil kapağı. Nur Vakti ürünü öne çıkar.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b0d"/>
      <stop offset=".62" stop-color="#101412"/>
      <stop offset="1" stop-color="#1b1812"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b7140"/>
      <stop offset=".52" stop-color="#d7b878"/>
      <stop offset="1" stop-color="#8b7140"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#e9d9b8" stroke-opacity=".055"/>
    </pattern>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#bd9954" stop-opacity=".16"/>
      <stop offset="1" stop-color="#bd9954" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="360" rx="20" fill="url(#background)"/>
  <rect width="1280" height="360" rx="20" fill="url(#grid)"/>
  <ellipse cx="1030" cy="180" rx="430" ry="255" fill="url(#halo)"/>

  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="74" y="75" font-size="17" font-weight="600" letter-spacing="2" fill="#c6a76b">INDEPENDENT PRODUCT ENGINEER</text>
    <text x="72" y="151" font-family="Georgia,Times New Roman,serif" font-size="64" font-weight="700" letter-spacing="1.5" fill="#f1eadb">ARDA ÖZEN</text>
    <path d="M75 177H566" stroke="url(#gold)" stroke-width="2"/>
    <text x="74" y="218" font-size="19" fill="#c7c1b5">Ürün sistemleri  ·  Veri yönetimi  ·  Mobil deneyimler</text>
    <text x="74" y="254" font-family="Georgia,Times New Roman,serif" font-size="18" fill="#92998f">Gerçek ihtiyaçlardan, çalışan dijital ürünlere.</text>
    <rect x="74" y="286" width="270" height="34" rx="17" fill="none" stroke="#8b7140" stroke-opacity=".7"/>
    <text x="94" y="308" font-size="13" letter-spacing="1" fill="#b8aa8e">BUILD  ·  MEASURE  ·  REFINE</text>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M642 92h68l32 32h48" stroke="#4aa899" stroke-width="2" stroke-opacity=".6"/>
    <path d="M618 157h90l38 38h51" stroke="#c8a96a" stroke-width="2" stroke-opacity=".65"/>
    <path d="M654 247h70l31-31h42" stroke="#4aa899" stroke-width="2" stroke-opacity=".5"/>
    <circle cx="642" cy="92" r="4" fill="#76d3be" stroke="none"/>
    <circle cx="618" cy="157" r="3" fill="#d7b878" stroke="none"/>
  </g>

  <g>
    <rect x="815" y="54" width="356" height="222" rx="16" fill="#111515" stroke="#9a8254" stroke-width="2"/>
    <rect x="833" y="72" width="320" height="186" rx="10" fill="#0b1111" stroke="#4e625e" stroke-opacity=".75"/>
    <circle cx="993" cy="64" r="2" fill="#c8a96a"/>
    <g font-family="Segoe UI,Arial,sans-serif">
      <text x="855" y="106" font-size="13" letter-spacing="1.5" fill="#8d9b97">PRODUCT / 01</text>
      <text x="855" y="139" font-size="20" font-weight="600" letter-spacing="1" fill="#eee4d1">NUR VAKTİ</text>
      <path d="M855 153h193" stroke="url(#gold)" stroke-width="2"/>
      <text x="855" y="170" font-size="10" letter-spacing="1" fill="#88968f">ANDROID  ·  IOS  ·  WEB</text>
    </g>
    <rect x="855" y="182" width="115" height="43" rx="8" fill="#1e2524" stroke="#4aa899" stroke-opacity=".5"/>
    <rect x="984" y="182" width="144" height="43" rx="8" fill="#1e2322" stroke="#c8a96a" stroke-opacity=".5"/>
    <circle cx="893" cy="203" r="13" fill="none" stroke="#61c8b4" stroke-width="2"/>
    <path d="M892 191a12 12 0 1 0 12 21 12 12 0 1 1-12-21Z" fill="#c8a96a"/>
    <path d="M1003 196h99M1003 207h72" stroke="#b9b5a6" stroke-opacity=".6" stroke-width="2"/>
    <path d="M793 278h399l48 32H748Z" fill="#101313" stroke="#9a8254" stroke-opacity=".65"/>
    <rect x="736" y="310" width="514" height="10" rx="5" fill="#050607"/>
  </g>
</svg>
